name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify FSFE REUSE 3.3 licensing & SPDX compliance
        uses: fsfe/reuse-action@v5
      - name: Validate codemeta.json syntax
        run: jq empty codemeta.json
      - name: Run release unit and falsification tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --release
      - name: Run offline benchmark and verification CLI smoke checks
        run: |
          cargo run --release -- bench
          cargo run --release -- quantize-demo
          cargo run --release -- verify-gate
          cargo run --release -- export-manifest > /dev/null
